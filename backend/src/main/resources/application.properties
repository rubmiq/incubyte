spring.application.name=salary-service

# PostgreSQL connection is always externally configured (Docker Compose / environment),
# never a bundled default pointing at a real database.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns schema; Hibernate only validates it against the mapped entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Narrow, unauthenticated health endpoint only; no other management endpoint exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Demo HR account is synthetic and environment-provided; no default password is baked in.
app.demo.hr-username=${DEMO_HR_USERNAME}
app.demo.hr-password=${DEMO_HR_PASSWORD}

# Seeding is an explicit, opt-in operation, never a side effect of a normal boot.
app.seed.enabled=${SEED_ON_STARTUP:false}
